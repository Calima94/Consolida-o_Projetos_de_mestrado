name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Lint + unit tests (host Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy scikit-learn PyWavelets pandas joblib pyyaml pytest ruff==0.15.8
      - name: Fetch thesis data (pinned commit, SHA-256 checked)
        run: ./scripts/fetch_legacy_data.sh
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q

  docker:
    name: Docker image + ROS tests + end-to-end
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Fetch thesis data
        run: ./scripts/fetch_legacy_data.sh
      - name: Validate compose files
        run: |
          docker compose -f docker/compose.yaml config -q
          for f in gui wsl camera myo; do
            docker compose -f docker/compose.yaml -f docker/compose.$f.yaml config -q
          done
      - name: Build image (ROS 2 Lyrical + Gazebo Jetty)
        run: docker build -f docker/Dockerfile -t mestrado-ros:lyrical .
      - name: Unit tests inside the image (incl. ROS message helpers)
        run: >
          docker run --rm -v "$PWD:/repo:ro" -w /repo -e PYTHONDONTWRITEBYTECODE=1
          mestrado-ros:lyrical python3 -m pytest -q -p no:cacheprovider
      - name: End-to-end (replay -> classifier -> Gazebo) + clean shutdown
        run: >
          docker run --rm --init -v "$PWD/data:/data" -v "$PWD/scripts:/scripts"
          mestrado-ros:lyrical /scripts/integration_test.sh
      - name: End-to-end capture tool (thesis video + replayed sEMG) + mirror mode
        run: >
          docker run --rm --init -v "$PWD/data:/data" -v "$PWD/scripts:/scripts"
          mestrado-ros:lyrical /scripts/capture_test.sh
